# このワークフローが赤い = その日のデータが欠けている、という意味に限定する。
# コードのテストや提案の書式検査は checks.yml に分けてある。取得失敗の通知を
# 鈍らせないため、データ以外の理由でここを赤くしない。
name: daily-chart

on:
  schedule:
    # cron は UTC 指定。GitHub のスケジュールは遅延だけでなくスキップもされるため、
    # 1日3回走らせて取りこぼしを防ぐ。2回目以降はその日のデータが既にあれば何もしない。
    #
    # chart_date は取得時刻の JST 日付から付くので、予備実行は当日中に終わる必要がある。
    # 実測の遅延は約3時間15分（8/20: 3h13m, 8/21: 3h15m）で安定しているため、
    # 最終便でも遅延後 20:32 JST 着で、実測の倍まで膨らんでも日付をまたがない時刻にする。
    - cron: "17 0 * * *"  # 09:17 JST 本番  (遅延後 約12:32)
    - cron: "17 4 * * *"  # 13:17 JST 予備1 (遅延後 約16:32)
    - cron: "17 8 * * *"  # 17:17 JST 予備2 (遅延後 約20:32)
  # Actions タブから手動でも実行できるようにしておく
  workflow_dispatch:
    inputs:
      force:
        description: "その日のデータが既にあっても取得し直す"
        type: boolean
        default: false

# GITHUB_TOKEN の既定は読み取りのみ。リポジトリに書き戻すため contents: write を付与する
permissions:
  contents: write

# 手動実行と定時実行が重なっても同時に走らせない（push が衝突するため）
concurrency:
  group: daily-chart
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 予備実行がその日のデータを上書きしないよう --skip-if-recorded を付ける。
      # 手動実行で force を選んだときだけ取得し直す。
      - name: チャートを取得して保存
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "force 指定: その日のデータがあっても取得し直します"
            python scripts/fetch_chart.py
          else
            python scripts/fetch_chart.py --skip-if-recorded
          fi

      # 同じ曲の track_id が前日から変わっていたら失敗させる（データが1日分だけならスキップ）
      - name: track_id の安定性をチェック
        run: python scripts/check_id_stability.py

      # 生JSONを正として、テーブルへの取り込みが欠けていないか照合する
      - name: 生JSONとテーブルの件数を照合
        run: python scripts/check_counts.py

      # 取得の成否と欠測日を、ログに残った試行から一覧する（失敗にはしない）
      - name: 取得状況を表示
        if: ${{ !cancelled() }}
        run: python scripts/fetch_log.py

      # チェックが落ちても取得した当日分は残したいので、キャンセル以外では必ず実行する。
      # ジョブ全体はチェックの失敗により赤のままになる。
      - name: 変更をコミットして push
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --staged --quiet; then
            echo "変更なし。コミットをスキップします。"
            exit 0
          fi
          git add data
          git commit -m "chore: chart snapshot $(TZ=Asia/Tokyo date +%F)"
          # 手動 push と競合した場合に備えて取り込んでから送る
          git pull --rebase --autostash
          git push
