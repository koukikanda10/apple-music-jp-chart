name: daily-chart

on:
  schedule:
    # cron は UTC 指定。GitHub のスケジュールは遅延だけでなくスキップもされるため、
    # 1日3回走らせて取りこぼしを防ぐ。2回目以降はその日のデータが既にあれば何もしない。
    # 毎時00分は混雑して遅延しやすいので 17分 にずらしている。
    - cron: "17 0 * * *"   # 09:17 JST 本番
    - cron: "17 6 * * *"   # 15:17 JST 予備1
    - cron: "17 12 * * *"  # 21:17 JST 予備2
  # Actions タブから手動でも実行できるようにしておく
  workflow_dispatch:
    inputs:
      force:
        description: "その日のデータが既にあっても取得し直す"
        type: boolean
        default: false

# GITHUB_TOKEN の既定は読み取りのみ。リポジトリに書き戻すため contents: write を付与する
permissions:
  contents: write

# 手動実行と定時実行が重なっても同時に走らせない（push が衝突するため）
concurrency:
  group: daily-chart
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 予備実行がその日のデータを上書きしないよう --skip-if-recorded を付ける。
      # 手動実行で force を選んだときだけ取得し直す。
      - name: チャートを取得して保存
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "force 指定: その日のデータがあっても取得し直します"
            python scripts/fetch_chart.py
          else
            python scripts/fetch_chart.py --skip-if-recorded
          fi

      # 同じ曲の track_id が前日から変わっていたら失敗させる（データが1日分だけならスキップ）
      - name: track_id の安定性をチェック
        run: python scripts/check_id_stability.py

      # チェックが落ちても取得した当日分は残したいので、キャンセル以外では必ず実行する。
      # ジョブ全体はチェックの失敗により赤のままになる。
      - name: 変更をコミットして push
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --staged --quiet; then
            echo "変更なし。コミットをスキップします。"
            exit 0
          fi
          git add data
          git commit -m "chore: chart snapshot $(TZ=Asia/Tokyo date +%F)"
          # 手動 push と競合した場合に備えて取り込んでから送る
          git pull --rebase --autostash
          git push
